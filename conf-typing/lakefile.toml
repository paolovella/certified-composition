name = "ConfTyping"
defaultTargets = ["ConfTyping"]
# An unknown name in a statement is an error, and not a new variable (AI-01).
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "ConfTyping"

[[require]]
name = "TransportCalculus"
path = "../transport-calculus"

# L's trusted core (PH1); the UCmd adapter and P1 build on it.
[[require]]
name = "LCore"
path = "../l-core"

[[lean_exe]]
name = "certcheck"
root = "Main"

[[lean_exe]]
name = "certcompose"
root = "CertCompose"
